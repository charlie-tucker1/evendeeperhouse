[project]
name = "deephouse"
version = "0.1.0"
description = "Search-based DJ transition engine for deep/melodic/tech house (Stockfish first, AlphaGo later)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Charlie Tucker" }]

dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "librosa>=0.10",
  "soundfile>=0.12",
  "soxr>=0.3",
  "pyloudnorm>=0.1",
  "matplotlib>=3.8",
  "typer>=0.12",
  "rich>=13",
  "pyyaml>=6",
]

[project.optional-dependencies]
# Phase 0 extras that need a GPU / heavier wheels — install on the 5070 box.
analysis = [
  "beat_this @ git+https://github.com/CPJKU/beat_this",
  "essentia",
  "demucs",
  "laion-clap",
]
render = ["pedalboard", "pyrubberband", "sounddevice"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
deephouse = "deephouse.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deephouse"]

[tool.hatch.metadata]
allow-direct-references = true  # beat_this is git-only

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
ignore = ["E501", "B008"]  # B008: typer.Option in defaults is the typer idiom

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
